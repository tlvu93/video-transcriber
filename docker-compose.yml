services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Postgres 18+ manages versioned data directories under /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videotranscriber"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: services/api_service/Dockerfile
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LLM_HOST=${LLM_HOST}
      - LLM_MODEL=${LLM_MODEL:-qwen3:14b}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - METRICS_RECORDING_ENABLED=${METRICS_RECORDING_ENABLED:-1}
      - METRICS_DEFAULT_LOOKBACK_HOURS=${METRICS_DEFAULT_LOOKBACK_HOURS:-168}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/app
      - SERVICE_NAME=api
      - SKIP_DB_INIT=${SKIP_DB_INIT}
      - VIDEO_DIRS=${VIDEO_DIRS}
    ports:
      - "${API_PORT}:8000"
    command:
      ["python", "-m", "backend.app.entrypoints.api"]
    working_dir: /app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  transcription-worker:
    build:
      context: .
      dockerfile: services/transcription_service/Dockerfile
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - METRICS_RECORDING_ENABLED=${METRICS_RECORDING_ENABLED:-1}
      - METRICS_DEFAULT_LOOKBACK_HOURS=${METRICS_DEFAULT_LOOKBACK_HOURS:-168}
      - MAX_WORKERS=${MAX_WORKERS}
      - PYTHONDONTWRITEBYTECODE=1
      - SERVICE_NAME=transcription-worker
      - VIDEO_DIRS=${VIDEO_DIRS}
      - HF_TOKEN=${HF_TOKEN}
      - WHISPERX_MODEL_NAME=${WHISPERX_MODEL_NAME:-}
      - WHISPERX_COMPUTE_TYPE=${WHISPERX_COMPUTE_TYPE:-}
      - WHISPERX_ENABLE_ALIGNMENT=${WHISPERX_ENABLE_ALIGNMENT:-1}
      - WHISPERX_ENABLE_DIARIZATION=${WHISPERX_ENABLE_DIARIZATION:-1}
    command:
      ["sh", "-c", "python -m backend.app.entrypoints.transcription_worker --max-workers=${MAX_WORKERS}"]
    working_dir: /app
    restart: unless-stopped
    # deploy:
    #   resources:
    #     limits:
    #       memory: 16G
    #       cpus: "7.0"
    #     reservations:
    #       memory: 8G
    #       cpus: "7.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  summarization-worker:
    build:
      context: .
      dockerfile: services/summarization_service/Dockerfile
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LLM_HOST=${LLM_HOST}
      - LLM_MODEL=${LLM_MODEL:-qwen3:14b}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - METRICS_RECORDING_ENABLED=${METRICS_RECORDING_ENABLED:-1}
      - METRICS_DEFAULT_LOOKBACK_HOURS=${METRICS_DEFAULT_LOOKBACK_HOURS:-168}
      - SERVICE_NAME=summarization-worker
      - SUMMARIZATION_LLM_MODEL=${SUMMARIZATION_LLM_MODEL:-}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/app
    command:
      ["python", "-m", "backend.app.entrypoints.summarization_worker"]
    working_dir: /app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  translation-worker:
    build:
      context: .
      dockerfile: services/translation_service/Dockerfile
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LLM_HOST=${LLM_HOST}
      - LLM_MODEL=${LLM_MODEL:-qwen3:14b}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - METRICS_RECORDING_ENABLED=${METRICS_RECORDING_ENABLED:-1}
      - METRICS_DEFAULT_LOOKBACK_HOURS=${METRICS_DEFAULT_LOOKBACK_HOURS:-168}
      - SERVICE_NAME=translation-worker
      - TRANSLATION_LLM_MODEL=${TRANSLATION_LLM_MODEL:-}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/app
    command:
      ["python", "-m", "backend.app.entrypoints.translation_worker"]
    working_dir: /app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ollama:
    image: ollama/ollama:0.13.5
    environment:
      - LLM_MODEL=${LLM_MODEL:-qwen3:14b}
      - SUMMARIZATION_LLM_MODEL=${SUMMARIZATION_LLM_MODEL:-}
      - TRANSLATION_LLM_MODEL=${TRANSLATION_LLM_MODEL:-}
    volumes:
      - ./ollama-data:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/ollama-entrypoint.sh
    ports:
      - "${OLLAMA_PORT}:11434"
    restart: unless-stopped
    entrypoint: ["/ollama-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s # Give time for the model to be pulled
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  watcher:
    build:
      context: .
      dockerfile: services/watcher_service/Dockerfile
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - METRICS_RECORDING_ENABLED=${METRICS_RECORDING_ENABLED:-1}
      - METRICS_DEFAULT_LOOKBACK_HOURS=${METRICS_DEFAULT_LOOKBACK_HOURS:-168}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/app
      - SERVICE_NAME=watcher
      - VIDEO_DIRS=${VIDEO_DIRS}
    command:
      ["python", "-m", "backend.app.entrypoints.watcher"]
    working_dir: /app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
