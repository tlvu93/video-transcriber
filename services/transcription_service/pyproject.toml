[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcription_service"
version = "0.1.0"
description = "Transcription service for Video Transcriber application"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "ffmpeg-python>=0.2.0,<1",
    "requests>=2.32.0,<3",
    "pika==1.3.2",
    "whisperx==3.3.4",
    "ctranslate2<4.5.0",
    "faster-whisper>=1.1.1,<2",
    "nltk>=3.9.1,<4",
    "numpy>=2.0.2,<3",
    "onnxruntime>=1.19,<2",
    "pandas>=2.2.3,<3",
    "pyannote-audio>=3.3.2,<5",
    "torch>=2.5.1,<3",
    "torchaudio>=2.5.1,<3",
    "transformers>=4.48.0,<5",
]

[tool.setuptools]
packages = ["transcription"]
