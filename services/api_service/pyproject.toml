[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api_service"
version = "0.1.0"
description = "API service for Video Transcriber application"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "alembic>=1.16.0,<2",
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.34.0,<1",
    "python-multipart>=0.0.20,<1",
    "aiofiles>=24.1.0,<26",
    "sqlalchemy>=2.0.0,<3",
    "pydantic>=2.10.0,<3",
    "psycopg2-binary>=2.9.0,<3",
    "pika==1.3.2",
    "yt-dlp>=2025.10.14,<2027",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pip-tools>=7.4.0",
    "black>=21.5b2",
    "isort>=5.9.1",
    "mypy>=0.910",
    "flake8>=6.0.0",
    "pre-commit>=3.3.2",
    "types-requests>=2.31.0",
]

[tool.setuptools]
packages = ["api"]
