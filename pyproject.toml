[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-transcriber-backend"
version = "0.1.0"
description = "Canonical backend package for the Video Transcriber application"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.16.0,<2",
    "psycopg[binary]>=3.2.0,<4",
    "sqlalchemy>=2.0.0,<3",
]

[project.optional-dependencies]
api = [
    "aiofiles>=24.1.0,<26",
    "fastapi>=0.115.0,<1",
    "pydantic>=2.10.0,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34.0,<1",
    "yt-dlp>=2025.10.14,<2027",
]
summarization = [
    "nltk>=3.9.0,<4",
    "pydantic>=2.10.0,<3",
    "requests>=2.32.0,<3",
]
transcription = [
    "ffmpeg-python>=0.2.0,<1",
    "faster-whisper>=1.2.1,<2",
    "nltk>=3.9.1,<4",
    "numpy>=2.0.2,<3",
    "onnxruntime>=1.19,<2",
    "pandas>=2.2.3,<4",
    "pyannote-audio>=3.3.2,<5",
    "requests>=2.32.0,<3",
    "torch>=2.5.1,<3",
    "torchaudio>=2.5.1,<3",
    "transformers>=4.48.0,<5",
    "whisperx>=3.7.6,<4",
]
translation = [
    "pydantic>=2.10.0,<3",
    "requests>=2.32.0,<3",
]
watcher = [
    "requests>=2.32.0,<3",
    "watchdog>=6.0.0,<7",
]
dev = [
    "black>=21.5b2",
    "flake8>=6.0.0",
    "isort>=5.9.1",
    "mypy>=0.910",
    "pip-tools>=7.4.0",
    "pre-commit>=3.3.2",
    "pytest>=6.0.0",
    "ruff>=0.16.0,<1",
    "types-requests>=2.31.0",
]

[tool.setuptools.package-data]
"backend.app.api" = ["py.typed"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
"alembic/env.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "fastapi.Cookie", "fastapi.File", "fastapi.Form"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
plugins = ["sqlalchemy.ext.mypy.plugin"]
disable_error_code = [
    "assignment",
    "attr-defined",
    "dict-item",
    "no-any-return",
    "no-untyped-def",
    "return-value",
    "union-attr",
    "var-annotated",
]

[[tool.mypy.overrides]]
module = [
    "aiofiles.*",
    "alembic.*",
    "fastapi.*",
    "faster_whisper.*",
    "ffmpeg.*",
    "nltk.*",
    "numpy.*",
    "onnxruntime.*",
    "pandas.*",
    "psycopg.*",
    "pydantic.*",
    "pyannote.*",
    "requests.*",
    "setuptools.*",
    "sqlalchemy.*",
    "torch.*",
    "torchaudio.*",
    "transformers.*",
    "uvicorn.*",
    "watchdog.*",
    "whisperx.*",
    "yt_dlp.*",
]
ignore_missing_imports = true

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", "*/.venv", "*/venv", "venv", "frontend"]
per-file-ignores = ["__init__.py:F401"]
