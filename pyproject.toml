[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
plugins = ["sqlalchemy.ext.mypy.plugin"]
disable_error_code = [
    "assignment",
    "attr-defined",
    "dict-item",
    "no-any-return",
    "no-untyped-def",
    "return-value",
    "union-attr",
    "var-annotated",
]

[[tool.mypy.overrides]]
module = [
    "api.*",
    "fastapi.*",
    "langchain.*",
    "langchain_core.*",
    "pika.*",
    "pydantic.*",
    "services.api_service.api.*",
    "services.summarization_service.summarization.*",
    "services.transcription_service.transcription.*",
    "services.translation_service.translation.*",
    "services.watcher_service.watcher.*",
    "setuptools.*",
    "sqlalchemy.*",
    "summarization.*",
    "torch.*",
    "transcription.*",
    "translation.*",
    "uvicorn.*",
    "watchdog.*",
    "watcher.*",
    "whisperx.*",
]
ignore_missing_imports = true

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", "*/.venv", "*/venv", "venv", "frontend"]
per-file-ignores = ["__init__.py:F401"]
