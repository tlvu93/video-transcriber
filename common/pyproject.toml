[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "common"
version = "0.1.0"
description = "Common utilities for Video Transcriber application"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pika==1.3.2",
]

[project.optional-dependencies]
dev = [
    "pip-tools>=7.4.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.3.0",
    "pre-commit>=3.3.2",
]

[tool.setuptools]
py-modules = ["messaging"]
